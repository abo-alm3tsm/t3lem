const D=RAW.map(([ic,n,c,d,l],i)=>{const lv=l.split("|").map(x=>x.split(","));let p=null;const pre=lv.map(a=>a.map(t=>{const r=p;p=t;return r}));return{id:i,ic,n,c,d,lv,pre}});

/* ===== الحالة والتخزين ===== */
let st={d:{},f:{}};try{st=JSON.parse(localStorage.getItem("sr"))||st}catch(e){}
const save=()=>{try{localStorage.setItem("sr",JSON.stringify(st))}catch(e){}};
const $=q=>document.querySelector(q),N=n=>Number(n).toLocaleString("ar-EG");
const tid=(s,l,t)=>s.id+"-"+l+"-"+t;
const pr=s=>{let t=0,d=0;s.lv.forEach((a,l)=>a.forEach((_,k)=>{t++;if(st.d[tid(s,l,k)])d++}));return[d,t]};
const pc=s=>{const[d,t]=pr(s);return Math.round(d/t*100)};
const tot=()=>D.reduce((a,s)=>{const[d,t]=pr(s);return[a[0]+d,a[1]+t]},[0,0]);
let q="",cat="الكل",view="home";

/* ===== الواجهات ===== */
const NAV=[["home","🏠","الرئيسية"],["cat","📚","كتالوج العلوم"],["g","🕸️","خريطة المسارات"],["car","💼","المسارات المهنية"],["rec","🎯","ماذا أتعلم بعد؟"],["stats","📊","الإحصائيات"],["fav","⭐","المفضلة"]];
function side(){$("#sb").innerHTML=`<div class="logo">🧭 خريطة العلوم</div>`+NAV.map(([k,i,t])=>`<button class="nav ${view==k?"on":""}" data-v="${k}"><span>${i}</span>${t}</button>`).join("")+`<div style="margin-top:auto;padding:12px;color:var(--mu);font-size:13px">تقدّمك الكلي: <b style="color:var(--ac2)">${N(tp())}٪</b></div>`}
const tp=()=>{const[d,t]=tot();return Math.round(d/t*100)};
function card(s,i){const p=pc(s);return`<div class="card" style="animation-delay:${Math.min(i,12)*40}ms"><div class="ch"><span class="ic">${s.ic}</span><button class="fv ${st.f[s.id]?"on":""}" data-f="${s.id}" aria-label="مفضلة">${st.f[s.id]?"★":"☆"}</button></div><h3>${hl(s.n)}</h3><span class="tag">${s.c}</span><p>${hl(s.d)}</p><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${N(p)}٪ مكتمل</span><button class="btn" data-o="${s.id}">عرض المسار</button></div></div>`}
function filt(){return D.filter(s=>(cat=="الكل"||s.c==cat)&&(!q||(s.n+s.d+s.c+s.lv.join()+s.tp.flat().map(t=>t.summary).join()+CAR.filter(c=>c[2].includes(s.id)).map(c=>c[1]).join()).includes(q.trim())))}
function grid(){const r=filt();$("#gr").innerHTML=r.length?r.map((s,i)=>card(s,i)+(i%8==7?AD("بين بطاقات العلوم"):"")).join(""):`<div class="empty">😕 لا توجد علوم مطابقة لبحثك</div>`}
function stat(){const[d,t]=tot();return`<div class="stats"><div class="st"><b>${N(D.length)}</b><span>عدد العلوم</span></div><div class="st"><b>${N(t)}</b><span>عدد المواضيع</span></div><div class="st"><b>${N(d)}</b><span>مواضيع مكتملة</span></div><div class="st"><b>${N(tp())}٪</b><span>نسبة التعلّم</span></div></div>`}
function render(){side();const m=$("#mn");
 if(view=="home")m.innerHTML=`<div class="hero"><h1>تعلّم أي علم من الصفر حتى الاحتراف 🚀</h1><p>مسارات تعلّم مرتّبة من خمسة مستويات لأكثر من ${N(D.length)} علمًا، بلا قفز على المتطلبات السابقة. تابع تقدّمك وأنجز مواضيعك خطوة بخطوة.</p><div class="tools" style="margin:0"><input id="hs" placeholder="ابحث عن علم... مثال: البرمجة"><button class="btn" data-v="cat">استعرض الكتالوج</button></div></div>${stat()}<h2>🔥 علوم مقترحة للبدء</h2><div class="grid">${[0,1,2,23,29,44].map(i=>card(D[i],i)).join("")}</div>`;
 else if(view=="cat")m.innerHTML=`<h1>كتالوج العلوم</h1><div class="tools"><input id="se" value="${q}" placeholder="ابحث في العلوم والمواضيع..."></div><div class="chips">${CATS.map(c=>`<button class="chip ${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("")}</div><div class="grid" id="gr"></div>`,grid();
 else if(view=="fav"){const r=D.filter(s=>st.f[s.id]);m.innerHTML=`<h1>⭐ علومي المفضلة</h1><br>${r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="empty">لم تضف أي علم إلى المفضلة بعد.<br>اضغط على النجمة ☆ في أي بطاقة لحفظه هنا.</div>`}`}
 else{const rows=CATS.slice(1).map(c=>{const a=D.filter(s=>s.c==c);let d=0,t=0;a.forEach(s=>{const x=pr(s);d+=x[0];t+=x[1]});const p=Math.round(d/t*100);return`<div class="st"><div class="row" style="margin-top:0"><b style="font-size:16px;color:var(--tx)">${c} (${N(a.length)})</b><span>${N(p)}٪</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
  const act=D.filter(s=>pc(s)>0).sort((a,b)=>pc(b)-pc(a)).slice(0,6);
  m.innerHTML=`<h1>لوحة الإحصائيات</h1>${stat()}<h2>التقدّم حسب التصنيف</h2><div class="grid">${rows}</div><h2>أكثر العلوم تقدّمًا</h2>${act.length?`<div class="grid">${act.map(card).join("")}</div>`:`<div class="empty">ابدأ بإنجاز أول موضوع ليظهر تقدّمك هنا ✨</div>`}`}}
function modal(id,op){const s=D[id],[d,t]=pr(s),p=pc(s);
 $("#md").innerHTML=`<div class="box"><div class="ch"><span class="ic">${s.ic}</span><button class="btn g" data-x="1">✕ إغلاق</button></div><h1 style="margin-top:10px">${s.n}</h1><p style="color:var(--mu)">${s.d}</p><div class="row"><span>أنجزت ${N(d)} من ${N(t)} موضوعًا</span><b>${N(p)}٪</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="tools" style="margin:16px 0 4px"><button class="btn" data-e="1">توسيع الكل</button><button class="btn g" data-e="0">طيّ الكل</button><button class="btn g" data-f="${s.id}">${st.f[s.id]?"★ في المفضلة":"☆ أضف للمفضلة"}</button></div>`+s.lv.map((a,l)=>{const dn=a.filter((_,k)=>st.d[tid(s,l,k)]).length;return`<details ${op[l]?"open":""}><summary><span>${LV[l][0]}</span><span style="color:var(--mu);font-weight:400">${N(dn)}/${N(a.length)} · ⏱ ${N(LV[l][2])} ساعة</span></summary><div class="lb"><small>${LV[l][1]} في ${s.n}. المدة التقديرية: ${N(LV[l][2])} ساعة تقريبًا.</small>`+a.map((x,k)=>{const pre=s.pre[l][k],ck=st.d[tid(s,l,k)];return`<label class="tp ${ck?"dn":""}"><input type="checkbox" data-t="${tid(s,l,k)}" ${ck?"checked":""}><span><b>${x}</b><em>${pre?"🔒 المتطلب السابق: "+pre:"✅ نقطة البداية — لا تحتاج إلى معرفة سابقة"}</em></span></label>`}).join("")+`</div></details>`}).join("")+`</div>`;
 $("#md").classList.add("on");$("#md").dataset.id=id}
function reopen(){const o=[...document.querySelectorAll("#md details")].map(x=>x.open),y=$("#md").scrollTop;modal(+$("#md").dataset.id,o);$("#md").scrollTop=y}
